[project]
name = "robot-vision"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
    "tqdm",
    "opencv-python",
    "ultralytics",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
    "kornia>=0.8.2",
    "pycolmap>=4.1.0",
    "nats-py>=2.6.0",
]

# torch вынесен в extras: uv не умеет выбирать по наличию GPU (маркеры статические),
# поэтому вариант указывается явно при синхронизации.
#   машина без GPU:  uv sync --extra cpu
#   машина с GPU:    uv sync --extra cu126
# Jetson идёт мимо этого: у него свой Dockerfile.jetson на образе dustynv/pytorch,
# где torch уже собран под L4T, а uv sync не запускается вовсе.
[project.optional-dependencies]
cpu = ["torch", "torchvision"]
cu126 = ["torch", "torchvision"]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "mypy>=1.20.2",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["module2_localization", "module1_traffic_light", "module3_segmentation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "data"]

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "tqdm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
target-version = "py312"
exclude = ["venv", ".venv", "data"]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["TID252"]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "Q",      # quotes
    "TID",    # tidy imports
    "ANN",    # annotations
    "FAST",
    "T20",    # print
    "B",      # bugbear
    "SIM",    # simplify
    "ISC002", # implicit-str-concat
    "ISC003",
]
