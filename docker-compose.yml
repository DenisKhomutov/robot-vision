services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_localization
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  localization-api:
    build: .
    container_name: localization_api
    env_file: .env
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./weights:/app/weights
      - torch-hub-cache:/root/.cache/torch/hub
    depends_on:
      - qdrant
    restart: unless-stopped
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0 --port 8000

volumes:
  torch-hub-cache:
