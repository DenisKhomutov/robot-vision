services:
  nats:
    image: nats:latest
    container_name: nats
    network_mode: host
    restart: unless-stopped

  localization:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    container_name: localization
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    network_mode: host
    ipc: host
    volumes:
      - /tmp:/tmp
    depends_on:
      - nats
    restart: unless-stopped
